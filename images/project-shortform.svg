<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" fill="#181615"/>
  
  <!-- Smartphone / 9:16 vertical frame representation inside 16:9 canvas -->
  <rect x="475" y="60" width="330" height="600" rx="36" fill="#0E0D0D" stroke="#363230" stroke-width="2"/>
  
  <!-- Vertical reel screen content -->
  <rect x="495" y="90" width="290" height="540" rx="20" fill="#201D1B"/>
  
  <!-- Subtitle hook simulation -->
  <rect x="525" y="420" width="230" height="34" rx="6" fill="#FFC700"/>
  <text x="640" y="443" text-anchor="middle" fill="#181717" font-family="'Inter', sans-serif" font-size="14" font-weight="700">THE HOOK EFFECT</text>
  
  <rect x="545" y="465" width="190" height="24" rx="4" fill="#000000" fill-opacity="0.7"/>
  <text x="640" y="482" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">3-second retention lock</text>
  
  <!-- Center play button in vertical frame -->
  <circle cx="640" cy="300" r="46" fill="#181717" stroke="#FFC700" stroke-width="2"/>

  <rect x="1130" y="60" width="90" height="34" rx="17" fill="#2E2825" stroke="#483F3A" stroke-width="1"/>
  <text x="1175" y="82" text-anchor="middle" fill="#EAEAEA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">00:58</text>
  
  <text x="60" y="620" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">High-Engagement Vertical Reels Pacing</text>
  <text x="60" y="655" fill="#9C908B" font-family="'Inter', sans-serif" font-size="16">Adobe Premiere Pro • Dynamic Cuts, Sound FX &amp; Retention Engineering</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" fill="#141416"/>
  <!-- Subtle dark cinema texture -->
  <rect x="0" y="0" width="1280" height="720" fill="#1A1C20"/>
  
  <!-- Side-by-side format diagram representation (16:9 & 9:16) -->
  <!-- 16:9 Frame on Left -->
  <rect x="220" y="210" width="380" height="214" rx="16" fill="#141416" stroke="#363C4C" stroke-width="2"/>
  <rect x="235" y="225" width="350" height="184" rx="10" fill="#222630"/>
  <circle cx="410" cy="317" r="32" fill="#181717" stroke="#FFC700" stroke-width="2"/>
  <path d="M405 307L420 317L405 327V307Z" fill="#FFC700"/>
  <text x="410" y="445" text-anchor="middle" fill="#8E95A5" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">16:9 FULL-LENGTH</text>

  <!-- Arrow Transition in Center -->
  <g transform="translate(620, 305)">
    <path d="M0 12H35M35 12L24 1M35 12L24 23" stroke="#FFC700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 9:16 Frame on Right -->
  <rect x="685" y="170" width="166" height="295" rx="16" fill="#141416" stroke="#FFC700" stroke-width="2"/>
  <rect x="697" y="182" width="142" height="271" rx="10" fill="#222630"/>
  <circle cx="768" cy="317" r="24" fill="#181717" stroke="#FFC700" stroke-width="2"/>
  <path d="M764 309L776 317L764 325V309Z" fill="#FFC700"/>
  <text x="768" y="485" text-anchor="middle" fill="#FFC700" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">9:16 SHORT-FORM</text>

  <!-- Top Badges -->
  <rect x="60" y="60" width="150" height="34" rx="17" fill="#222630" stroke="#363C4C" stroke-width="1"/>
  <text x="135" y="82" text-anchor="middle" fill="#FFC700" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">VIDEO EDITING</text>
  
  <rect x="1100" y="60" width="120" height="34" rx="17" fill="#222630" stroke="#363C4C" stroke-width="1"/>
  <text x="1160" y="82" text-anchor="middle" fill="#EAEAEA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">FULL + SHORT</text>
  
  <!-- Content context overlay -->
  <text x="60" y="620" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">Talking Head — Content Repurposing</text>
  <text x="60" y="655" fill="#8E95A5" font-family="'Inter', sans-serif" font-size="16">One piece of content, edited for two different formats • Full-Length &amp; Social Reel</text>
  
  <line x1="60" y1="560" x2="1220" y2="560" stroke="#2C3240" stroke-width="1"/>
</svg>

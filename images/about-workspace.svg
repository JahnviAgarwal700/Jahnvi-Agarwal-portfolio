<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" fill="none">
  <rect width="1000" height="1100" rx="32" fill="#181717"/>
  
  <!-- Subtle editorial border guide -->
  <rect x="30" y="30" width="940" height="1040" rx="24" stroke="#2B2B2B" stroke-width="1.5"/>
  
  <!-- Minimalist workspace / editor desk illustration -->
  <!-- Monitor frame -->
  <rect x="150" y="160" width="700" height="420" rx="16" fill="#181717" stroke="#333333" stroke-width="1.5"/>
  
  <!-- Monitor content: Premiere Pro UI schematic -->
  <rect x="180" y="190" width="310" height="230" rx="8" fill="#1A1A1A"/>
  <rect x="510" y="190" width="310" height="230" rx="8" fill="#0D0D0D" stroke="#282828" stroke-width="1"/>
  
  <!-- Preview playhead & waveform -->
  <circle cx="665" cy="305" r="32" fill="#1A1A1A" stroke="#FFC700" stroke-width="1.5"/>
  <path d="M660 295L674 305L660 315V295Z" fill="#FFC700"/>
  
  <!-- Timeline in monitor -->
  <rect x="180" y="440" width="640" height="110" rx="8" fill="#161616"/>
  <line x1="200" y1="465" x2="800" y2="465" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="200" y1="500" x2="800" y2="500" stroke="#2A2A2A" stroke-width="1"/>
  
  <!-- Track blocks -->
  <rect x="200" y="472" width="220" height="20" rx="4" fill="#313E52"/>
  <rect x="430" y="472" width="180" height="20" rx="4" fill="#354C42"/>
  <rect x="620" y="472" width="160" height="20" rx="4" fill="#524330"/>
  <rect x="200" y="508" width="580" height="20" rx="4" fill="#242B36"/>
  
  <!-- Monitor stand -->
  <rect x="475" y="580" width="50" height="100" fill="#222222"/>
  <rect x="400" y="680" width="200" height="16" rx="8" fill="#2B2B2B"/>
  
  <!-- Studio headphone / desk accents -->
  <ellipse cx="260" cy="740" rx="60" ry="30" fill="#202020" stroke="#333333" stroke-width="1"/>
  <circle cx="260" cy="735" r="24" fill="#161616"/>
  
  <!-- Keyboard / Editing console -->
  <rect x="360" y="720" width="280" height="60" rx="8" fill="#202020" stroke="#333333" stroke-width="1"/>
  <!-- Key shortcuts subtle dots -->
  <circle cx="390" cy="740" r="4" fill="#FFC700"/>
  <circle cx="410" cy="740" r="4" fill="#555555"/>
  <circle cx="430" cy="740" r="4" fill="#555555"/>
  <circle cx="450" cy="740" r="4" fill="#555555"/>
  
  <!-- Placeholder badge -->
  <rect x="300" y="860" width="400" height="50" rx="25" fill="#222222" stroke="#3D3D3D" stroke-width="1"/>
  <text x="500" y="891" text-anchor="middle" fill="#E0E0E0" font-family="'Inter', sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">PHOTOGRAPH / WORKSPACE PLACEHOLDER</text>
  
  <text x="500" y="940" text-anchor="middle" fill="#777777" font-family="'Inter', sans-serif" font-size="12">Easily replaceable in /public/images/about-workspace.svg</text>
  
  <!-- Subtle editorial stamp at bottom -->
  <text x="500" y="1010" text-anchor="middle" fill="#FFC700" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">ADOBE PREMIERE PRO • AI PIPELINES</text>
</svg>

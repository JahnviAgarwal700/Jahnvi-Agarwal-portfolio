<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <!-- Background with editorial dark tone -->
  <rect width="1600" height="1000" fill="#181717" rx="32"/>
  
  <!-- Subtle premiere timeline grid / cinematic guides -->
  <line x1="100" y1="120" x2="1500" y2="120" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="100" y1="880" x2="1500" y2="880" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="800" y1="120" x2="800" y2="880" stroke="#262626" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Minimalist Premiere editing workspace preview representation -->
  <!-- Program Monitor representation -->
  <rect x="240" y="180" width="1120" height="520" rx="16" fill="#0D0D0D" stroke="#333333" stroke-width="1"/>
  
  <!-- Cinematic frame contents -->
  <circle cx="800" cy="400" r="140" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
  <path d="M780 360L840 400L780 440V360Z" fill="#FFC700"/>
  
  <!-- Timecode Display -->
  <rect x="280" y="220" width="160" height="34" rx="6" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
  <circle cx="300" cy="237" r="4" fill="#FFC700"/>
  <text x="315" y="243" fill="#EAEAEA" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="1">REC 00:01:24:18</text>
  
  <!-- 4K UHD badge -->
  <rect x="1220" y="220" width="100" height="34" rx="6" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
  <text x="1238" y="243" fill="#A0A0A0" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">4K UHD</text>
  
  <!-- Bottom timeline track mock -->
  <rect x="240" y="725" width="1120" height="110" rx="12" fill="#141414" stroke="#2A2A2A" stroke-width="1"/>
  
  <!-- Video Track V1 & Audio Track A1 -->
  <rect x="260" y="740" width="340" height="36" rx="6" fill="#2E384D" stroke="#3D4B66" stroke-width="1"/>
  <text x="275" y="763" fill="#88A3D9" font-family="'Inter', sans-serif" font-size="11" font-weight="500">V1_GEEKY_GAMER_MASTER.mov</text>
  
  <rect x="610" y="740" width="460" height="36" rx="6" fill="#2E4A40" stroke="#3E6557" stroke-width="1"/>
  <text x="625" y="763" fill="#8CD6BA" font-family="'Inter', sans-serif" font-size="11" font-weight="500">V1_COMMERCIAL_BROLL_4K.mp4</text>
  
  <rect x="1080" y="740" width="260" height="36" rx="6" fill="#4B3A28" stroke="#664F36" stroke-width="1"/>
  <text x="1095" y="763" fill="#FFC700" font-family="'Inter', sans-serif" font-size="11" font-weight="500">V1_COLOR_LUT_REC709</text>
  
  <!-- Audio wave track -->
  <rect x="260" y="785" width="1080" height="36" rx="6" fill="#1E232A" stroke="#2A303A" stroke-width="1"/>
  <path d="M280 803Q320 790 360 803T440 803T520 793T600 803T680 790T760 803T840 792T920 803T1000 795T1080 803T1160 790T1240 803T1320 803" stroke="#5F7696" stroke-width="2" fill="none"/>
  
  <!-- Playhead cursor in yellow -->
  <line x1="800" y1="725" x2="800" y2="835" stroke="#FFC700" stroke-width="2"/>
  <polygon points="794,725 806,725 800,735" fill="#FFC700"/>
  
  <!-- Label indicator -->
  <text x="800" y="930" text-anchor="middle" fill="#777777" font-family="'Inter', sans-serif" font-size="13" letter-spacing="1">SHOWREEL &amp; HERO PREVIEW PLACEHOLDER • 16:10</text>
</svg>

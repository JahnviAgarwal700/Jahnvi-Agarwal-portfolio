<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="50%" stop-color="#18181C" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD028" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="640" cy="360" r="320" fill="#FFC700" opacity="0.08" />

  <!-- Grid & Frame lines -->
  <rect x="40" y="40" width="1200" height="640" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5" />
  <line x1="640" y1="40" x2="640" y2="60" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="640" y1="660" x2="640" y2="680" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="40" y1="360" x2="60" y2="360" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="1220" y1="360" x2="1240" y2="360" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Index Number (top right) -->
  <text x="1200" y="90" text-anchor="end" font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFC700" letter-spacing="2">11</text>

  <!-- Center Play Button with Maroon Accent -->
  <g transform="translate(640, 320)">
    <circle r="46" fill="url(#maroonGrad)" filter="drop-shadow(0 6px 18px rgba(0,0,0,0.45))" />
    <polygon points="-8,-16 16,0 -8,16" fill="#FFFFFF" />
  </g>

  <!-- Category & Title -->
  <text x="640" y="420" text-anchor="middle" font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFC700" letter-spacing="3">MOTION GRAPHICS</text>
  <text x="640" y="456" text-anchor="middle" font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="600" fill="#F5F0E8" letter-spacing="-0.5">Motion Graphics</text>
  <text x="640" y="486" text-anchor="middle" font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#999999" letter-spacing="1">16:9 MASTER TIMELINE</text>

  <!-- Bottom Bar with Video Track indicators -->
  <rect x="70" y="630" width="1140" height="2" fill="#FFFFFF" opacity="0.08" />
  <rect x="70" y="630" width="380" height="2" fill="#FFC700" />
</svg>
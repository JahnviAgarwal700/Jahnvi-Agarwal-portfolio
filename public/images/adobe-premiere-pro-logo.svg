<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <radialGradient id="prBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2a004f"/>
      <stop offset="100%" stop-color="#0a001a"/>
    </radialGradient>
    <filter id="prGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Base Tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#prBg)" stroke="#9999FF" stroke-width="3" stroke-opacity="0.9"/>
  <!-- Inner Subtle Bevel -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
  <!-- Official Pr Glyphs -->
  <text x="64" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#9999FF" text-anchor="middle" letter-spacing="-1.5">Pr</text>
</svg>

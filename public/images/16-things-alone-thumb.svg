      <stop offset="0%" stop-color="#141216" />
      <stop offset="50%" stop-color="#1B1720" />
      <stop offset="100%" stop-color="#0E0D12" />
    </linearGradient>
    <linearGradient id="aloneMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD028" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E88CA3" />
      <stop offset="100%" stop-color="#C25470" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#aloneBgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="640" cy="360" r="320" fill="#FFD028" opacity="0.12" />
  <circle cx="640" cy="360" r="160" fill="#E88CA3" opacity="0.06" />


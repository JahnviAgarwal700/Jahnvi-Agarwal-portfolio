  <text x="640" y="416" text-anchor="middle" font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E88CA3" letter-spacing="3">TALKING HEAD VIDEOS</text>
  <text x="640" y="458" text-anchor="middle" font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="600" fill="#F5F0E8" letter-spacing="-0.5">16 Things Every Woman Should Know How To Do ALONE</text>

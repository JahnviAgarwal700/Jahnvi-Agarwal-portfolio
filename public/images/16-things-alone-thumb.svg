  <text x="1200" y="90" text-anchor="end" font-family="'Google Sans Flex', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFD028" letter-spacing="2">01</text>

  <!-- Play Circle -->
  <g transform="translate(640, 310)">
    <circle r="48" fill="url(#aloneMaroon)" filter="drop-shadow(0 6px 20px rgba(0,0,0,0.5))" />

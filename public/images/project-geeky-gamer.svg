<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" fill="#141416"/>
  <!-- Subtle dark grid & cinema texture -->
  <rect x="0" y="0" width="1280" height="720" fill="#1A1C20"/>
  <!-- Minimalist abstract composition for high-retention gaming/youtube pacing -->
  <circle cx="640" cy="360" r="280" stroke="#252A34" stroke-width="1.5"/>
  <circle cx="640" cy="360" r="190" stroke="#2D3442" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="640" cy="360" r="90" fill="#111317" stroke="#3A4354" stroke-width="2"/>
  
  <!-- Play glyph -->
  <path d="M630 335L665 360L630 385V335Z" fill="#FFC700"/>
  
  <!-- Category badge -->
  <rect x="60" y="60" width="130" height="34" rx="17" fill="#222630" stroke="#363C4C" stroke-width="1"/>
  <text x="125" y="82" text-anchor="middle" fill="#FFC700" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">YOUTUBE</text>
  
  <!-- Duration badge -->
  <rect x="1130" y="60" width="90" height="34" rx="17" fill="#222630" stroke="#363C4C" stroke-width="1"/>
  <text x="1175" y="82" text-anchor="middle" fill="#EAEAEA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">14:28</text>
  
  <!-- Content context overlay -->
  <text x="60" y="620" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">Geeky Gamer — 900K+ Retention Cut</text>
  <text x="60" y="655" fill="#8E95A5" font-family="'Inter', sans-serif" font-size="16">Adobe Premiere Pro • Dynamic Narrative Flow &amp; Audio Pacing</text>
  
  <!-- Subtle waveform line at bottom -->
  <line x1="60" y1="560" x2="1220" y2="560" stroke="#2C3240" stroke-width="1"/>
</svg>
